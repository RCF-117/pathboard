[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathboard"
version = "0.1.0"
description = "Experiments on multi-agent computer use in one shared live workspace"
requires-python = ">=3.10"
# Lower bounds only here. After installing, freeze the exact versions with
# `pip freeze > requirements.lock` and commit that file; every run manifest
# also records the versions actually used.
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6.0",
    "playwright>=1.48",
    "anthropic>=0.40",
    "openai>=3.55",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pathboard = ["testbed/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs a Playwright Chromium install"]

# Style and lint: `ruff format` then `ruff check` (both must be clean before a commit).
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade, simplify, ruff-specific, complexity
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "C90"]
ignore = [
    "E501",    # the formatter wraps code; long string literals (model prompts, task text, in-page
               # JavaScript) are kept intact on purpose so the text the model and page see is unchanged
    "RUF005",  # tuple concatenation reads fine in the task definitions
]

[tool.ruff.lint.mccabe]
max-complexity = 12

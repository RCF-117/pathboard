# Experiment 4e: can the board work without reading the app's server? The version check's latest
# values come from the board's registry, kept by each writer publishing what its own page shows
# right after its action. Scripted agents (recorded gpt-6.2-sol think times), $0.
# increment tasks (as in 4b-4d), 3 repetitions. Every job of a task gets its own agent.
tag: scripted-registry
output_root: runs
suite:
  seed: 31
  families: [increment]
  tasks_per_family: 6
  jobs_per_task: 4
  n_invoices: 40
  n_vendors: 8
  max_lines: 4
  first_invoice_number: 1001
render_mode: rerender_keyed
poll_interval_ms: 600        # other agents' changes reach each page within 0.6 s
api_latency_ms: 150
page_size: 15
browser:
  headless: true
  viewport_width: 1400
  viewport_height: 900
  settle_quiet_ms: 150
  settle_timeout_ms: 10000
  action_timeout_ms: 5000
handle_mode: ref
repetitions: 3
order_seed: 4
baseline: board_server
conditions:
  - {name: board_server,        team: per_job, lock: path,   scope: move,   notice: recheck_move_version}        # reference: latest value read from the app's server
  - {name: board_registry,      team: per_job, lock: path,   scope: move,   notice: recheck_move_registry}       # the board's own registry, kept by writers' pages
  - {name: board_registry_page, team: per_job, lock: path,   scope: move,   notice: recheck_move_registry_page}  # registry + the agent's own page
  - {name: save_server,         team: per_job, lock: global, scope: action, notice: recheck_move_version}        # save-time check, server values
  - {name: save_registry,       team: per_job, lock: global, scope: action, notice: recheck_move_registry}       # save-time check, registry values
lease_s: 45.0
start_timeout_s: 120.0
llm:
  provider: scripted
  settings:
    policy: increment
    think_times_from:
      - first_results/exp4-openai-budget/traces.jsonl
      - first_results/exp4b-openai-observed/traces.jsonl
    think_family: increment
    seed: 7
llm_agent:
  history_actions: 30
  max_steps_whole: 120
  max_steps_job: 40
bootstrap:
  n_boot: 10000
  confidence: 0.95
  seed: 20261120
outside: null   # nobody outside the board edits during a run
page_only: false   # the board and check use the harness's ground truth for paths and writes

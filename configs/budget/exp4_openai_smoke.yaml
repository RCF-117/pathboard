# Smoke test for Experiment 4: one increment task, each condition once (3 runs of 4 agents).
# Every job of a task gets its own agent; all start at once, each in its own tab of one app.
tag: openai-smoke
output_root: runs
suite:
  seed: 31
  families: [increment]
  tasks_per_family: 1
  jobs_per_task: 4
  n_invoices: 40
  n_vendors: 8
  max_lines: 4
  first_invoice_number: 1001
render_mode: rerender_keyed
poll_interval_ms: 600        # other agents' changes reach each page within 0.6 s
api_latency_ms: 150
page_size: 15
browser:
  headless: true
  viewport_width: 1400
  viewport_height: 900
  settle_quiet_ms: 150
  settle_timeout_ms: 10000
  action_timeout_ms: 5000
handle_mode: ref
repetitions: 1
order_seed: 4
baseline: lock_per_action     # condition 2 of the design doc
conditions:
  # name               lock    scope   notice            what it is
  - {name: no_board,        lock: none,   scope: action, notice: none}            # positive control: should lose updates
  - {name: lock_per_action, lock: global, scope: action, notice: recheck_target}  # one lock per action + target check
  - {name: board_per_move,  lock: path,   scope: move,   notice: recheck_target}  # path holds until the write + target check
lease_s: 45.0
start_timeout_s: 120.0
llm:
  provider: openai
  settings:
    model: gpt-6.2-sol
    max_output_tokens: 8192
    reasoning_effort: medium
    store: false
    max_retries: 4
    timeout_s: 120
    extra_body: {}
llm_agent:
  history_actions: 30
  max_steps_whole: 120
  max_steps_job: 40
bootstrap:
  n_boot: 10000
  confidence: 0.95
  seed: 20261120

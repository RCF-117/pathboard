# Experiment 4d, save_check re-run after fixing the check to cover the edit's own target (a save
# on a redrawn editor went unchecked). Experiment 4d: real-model check of the Experiment 4c result (gpt-6.2-sol, as in 4b). Board with version read
# marks vs the cheaper save-time check; both use the same version check (from the read at which
# the edit began), so they differ only in the holds. Increment tasks (same suite as 4b).
tag: sol-save-rerun
output_root: runs
suite:
  seed: 31
  families: [increment]
  tasks_per_family: 6
  jobs_per_task: 4
  n_invoices: 40
  n_vendors: 8
  max_lines: 4
  first_invoice_number: 1001
render_mode: rerender_keyed
poll_interval_ms: 600        # other agents' changes reach each page within 0.6 s
api_latency_ms: 150
page_size: 15
browser:
  headless: true
  viewport_width: 1400
  viewport_height: 900
  settle_quiet_ms: 150
  settle_timeout_ms: 10000
  action_timeout_ms: 5000
handle_mode: ref
repetitions: 2
order_seed: 4
baseline: save_check
conditions:
  - {name: save_check,          team: per_job, lock: global, scope: action, notice: recheck_move_version}  # the cheaper fix: one lock per action, validate the edit's read at save
lease_s: 45.0
start_timeout_s: 120.0
llm:
  provider: openai
  settings:
    model: gpt-6.2-sol
    max_output_tokens: 8192
    reasoning_effort: medium
    store: false
    max_retries: 4
    timeout_s: 120
    extra_body: {}
llm_agent:
  history_actions: 30
  max_steps_whole: 120
  max_steps_job: 40
bootstrap:
  n_boot: 10000
  confidence: 0.95
  seed: 20261120
outside: null   # nobody outside the board edits during a run
page_only: false   # the board and check use the harness's ground truth for paths and writes

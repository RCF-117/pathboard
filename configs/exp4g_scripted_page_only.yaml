# Experiment 4g (free part): as 4f, but the app is treated as third-party. The board and the
# check see only the agent's own page (live/pageview.py): no server, no testbed instrumentation.
tag: scripted-page-only
output_root: runs
suite:
  seed: 31
  families: [increment]
  tasks_per_family: 6
  jobs_per_task: 4
  n_invoices: 40
  n_vendors: 8
  max_lines: 4
  first_invoice_number: 1001
render_mode: rerender_keyed
poll_interval_ms: 600        # other agents' changes reach each page within 0.6 s
api_latency_ms: 150
page_size: 15
browser:
  headless: true
  viewport_width: 1400
  viewport_height: 900
  settle_quiet_ms: 150
  settle_timeout_ms: 10000
  action_timeout_ms: 5000
handle_mode: ref
repetitions: 3
order_seed: 4
baseline: board_registry
conditions:
  - {name: board_registry,      team: per_job, lock: path,   scope: move,   notice: recheck_move_registry}       # registry only: blind to outside edits
  - {name: board_registry_page, team: per_job, lock: path,   scope: move,   notice: recheck_move_registry_page}  # registry + the agent's own page
lease_s: 45.0
start_timeout_s: 120.0
llm:
  provider: scripted
  settings:
    policy: increment
    think_times_from:
      - first_results/exp4-openai-budget/traces.jsonl
      - first_results/exp4b-openai-observed/traces.jsonl
    think_family: increment
    seed: 7
llm_agent:
  history_actions: 30
  max_steps_whole: 120
  max_steps_job: 40
bootstrap:
  n_boot: 10000
  confidence: 0.95
  seed: 20261120
outside: {edits: 3, amount_cents: 700, first_s: 3.0, interval_s: 6.0}  # $7 added at 3 s, 9 s and 15 s while agents work
page_only: true   # the board and check see only the agent's page (a third-party app)

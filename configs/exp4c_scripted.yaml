# Experiment 4c (free): scripted agents with gpt-6.2-sol's recorded think times, on the 6
# increment tasks of 4b, 3 repetitions.  Which check keeps every amount, and at what cost?
# Every job of a task gets its own agent; all start at once, each in its own tab of one app.
tag: scripted-checks
output_root: runs
suite:
  seed: 31
  families: [increment]
  tasks_per_family: 6
  jobs_per_task: 4
  n_invoices: 40
  n_vendors: 8
  max_lines: 4
  first_invoice_number: 1001
render_mode: rerender_keyed
poll_interval_ms: 600        # other agents' changes reach each page within 0.6 s
api_latency_ms: 150
page_size: 15
browser:
  headless: true
  viewport_width: 1400
  viewport_height: 900
  settle_quiet_ms: 150
  settle_timeout_ms: 10000
  action_timeout_ms: 5000
handle_mode: ref
repetitions: 3
order_seed: 4
baseline: save_check
conditions:
  - {name: no_board,            team: per_job, lock: none,   scope: action, notice: none}                  # control: loses updates
  - {name: lock_page_check,     team: per_job, lock: global, scope: action, notice: recheck_observed}      # 4b: per-step check on the agent's own page
  - {name: board_page_check,    team: per_job, lock: path,   scope: move,   notice: recheck_observed}      # 4b: board, same page check
  - {name: lock_version_check,  team: per_job, lock: global, scope: action, notice: recheck_version}       # one lock, read-mark version check each step
  - {name: board_version_check, team: per_job, lock: path,   scope: move,   notice: recheck_version}       # the board as designed: holds per move + version check
  - {name: save_check,          team: per_job, lock: global, scope: action, notice: recheck_move_version}  # the cheaper fix: no waiting, validate the move's read at save
lease_s: 45.0
start_timeout_s: 120.0
llm:
  provider: scripted
  settings:
    policy: increment
    think_times_from:
      - first_results/exp4-openai-budget/traces.jsonl
      - first_results/exp4b-openai-observed/traces.jsonl
    think_family: increment
    seed: 7
llm_agent:
  history_actions: 30
  max_steps_whole: 120
  max_steps_job: 40
bootstrap:
  n_boot: 10000
  confidence: 0.95
  seed: 20261120
outside: null   # nobody outside the board edits during a run
